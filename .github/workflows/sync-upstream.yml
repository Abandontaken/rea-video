name: Sync upstream

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync from upstream
        id: sync
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          sync_log=$(gh repo sync "${{ github.repository }}" --branch "${{ github.event.repository.default_branch }}" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$sync_log"
          if [ "$status" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s\n' "$sync_log" | grep -F "can't sync because there are diverging changes"; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "sync_exit=$status" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="${{ github.event.repository.default_branch }}"
          parent_json=$(gh repo view "${{ github.repository }}" --json parent)
          set +e
          parent=$(printf '%s\n' "$parent_json" | bash scripts/sync_upstream_parent.sh)
          parent_status=$?
          set -e
          if [ "$parent_status" -ne 0 ] || ! printf '%s\n' "$parent" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "No usable upstream parent; cannot recover a diverged sync."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "sync_exit=$status" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/sync_upstream_fetch.sh . "https://github.com/${parent}.git" "+refs/heads/${branch}:refs/remotes/upstream/${branch}"
          if ! git config user.email >/dev/null; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
          fi
          set +e
          bash scripts/sync_upstream_git.sh . "$branch" "refs/remotes/upstream/${branch}"
          recover=$?
          set -e
          if [ "$recover" -eq 0 ]; then
            git push origin "refs/heads/${branch}:${branch}"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Diverged upstream sync was not recovered (status ${recover})."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "sync_exit=$status" >> "$GITHUB_OUTPUT"
          fi

      - name: Disable other Actions workflows
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SELF_PATH='.github/workflows/sync-upstream.yml'
          gh api "repos/${{ github.repository }}/actions/workflows" --paginate \
            --jq '.workflows[] | [.id, .path, .state] | @tsv' \
          | while IFS=$'\t' read -r id path state; do
              [ -n "${id:-}" ] || continue
              if [ "$path" = "$SELF_PATH" ]; then
                if [ "$state" != "active" ]; then
                  echo "Enabling $path ($id)"
                  gh api --method PUT "repos/${{ github.repository }}/actions/workflows/${id}/enable"
                fi
                continue
              fi
              if [ "$state" = "active" ]; then
                echo "Disabling $path ($id, state=$state)"
                gh api --method PUT "repos/${{ github.repository }}/actions/workflows/${id}/disable"
              fi
            done

      - name: Cancel stray runs triggered by the sync merge
        if: always() && steps.sync.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SELF_PATH='.github/workflows/sync-upstream.yml'
          SELF_RUN_ID='${{ github.run_id }}'
          now=$(date -u +%s)
          for status in queued in_progress waiting requested pending; do
            gh api "repos/${{ github.repository }}/actions/runs?status=${status}&per_page=100" \
              --jq '.workflow_runs[] | [.id, .path, .status, .created_at, .html_url] | @tsv' \
            | while IFS=$'\t' read -r id path run_status created_at url; do
                [ -n "${id:-}" ] || continue
                [ "$id" != "$SELF_RUN_ID" ] || continue
                [ "$path" != "$SELF_PATH" ] || continue
                created_epoch=$(date -u -d "$created_at" +%s)
                age=$((now - created_epoch))
                if [ "$age" -gt 900 ]; then
                  echo "Skipping older run $id ($path, status=$run_status, age=${age}s)"
                  continue
                fi
                echo "Cancelling $path run $id (status=$run_status, age=${age}s) $url"
                gh api --method POST "repos/${{ github.repository }}/actions/runs/${id}/cancel" >/dev/null \
                  || echo "Cancel failed for $id (may already be finishing)"
              done
          done

      - name: Open or update conflict issue
        if: always() && steps.sync.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          TITLE='Upstream sync needs manual merge'
          BODY="Automatic daily sync from upstream failed because this fork has diverged or has merge conflicts.

          This workflow never force-pushes. Please merge upstream into the default branch manually (GitHub's \"Sync fork\" UI, or a local merge), then resolve conflicts.

          Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Close this issue after you have merged."
          if {
            existing="$(gh issue list --repo "${{ github.repository }}" --state open --json number,title --jq '.[] | select(.title=="Upstream sync needs manual merge") | .number' | head -n 1)"
            if [ -n "${existing:-}" ]; then
              gh issue comment "$existing" --repo "${{ github.repository }}" --body "Another automatic sync attempt failed. Manual merge is still required.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            else
              gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
            fi
          }; then
            echo "Conflict notice issue created or updated."
          else
            echo "Could not open or update a GitHub issue (issues may be disabled on this fork)."
            {
              echo "## Upstream sync needs manual merge"
              echo
              echo "Automatic daily sync from upstream failed because this fork has diverged or has merge conflicts."
              echo
              echo "This workflow never force-pushes. Please merge upstream into the default branch manually (GitHub's \"Sync fork\" UI, or a local merge), then resolve conflicts."
              echo
              echo "Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo
              echo "A GitHub issue could not be created or updated — issues are probably disabled on this repository."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail job if sync failed
        if: always() && steps.sync.outputs.ok != 'true'
        run: |
          echo "Upstream sync failed (exit ${{ steps.sync.outputs.sync_exit }}). This is a real sync failure, not a notice-step error."
          exit 1
